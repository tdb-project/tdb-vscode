name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag must match package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - name: Type check
        run: npm run typecheck

      - name: Build and package
        run: |
          node esbuild.mjs --production
          npx vsce package --out tdb-vscode.vsix

      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tdb-vscode.vsix --title "$GITHUB_REF_NAME" --generate-notes

      # Marketplace publishing needs an Azure DevOps token. Without one, upload
      # the release's .vsix at https://marketplace.visualstudio.com/manage.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath tdb-vscode.vsix

      - name: Marketplace upload is manual
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT not set. Upload tdb-vscode.vsix from the GitHub release at https://marketplace.visualstudio.com/manage"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish tdb-vscode.vsix
